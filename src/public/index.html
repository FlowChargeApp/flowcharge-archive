<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Praxis Projects</title>
<link rel="stylesheet" href="styles.css">
<script src="theme-init.js"></script>
</head>
<body>

<header class="toolbar">
  <img class="tb-wordmark" src="img/flowcharge-wordmark.png" alt="FlowCharge" width="770" height="124">
  <img class="tb-mark" src="img/flowcharge-mark.png" alt="" aria-hidden="true" width="1000" height="1000">
  <button type="button" id="manage-integrations-button" class="tb-button">Manage integrations</button>
  <div class="seg" id="theme-seg" role="group" aria-label="Theme">
    <button type="button" data-mode="system" aria-label="Match system theme" title="System">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
    </button>
    <button type="button" data-mode="light" aria-label="Light theme" title="Light">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button type="button" data-mode="dark" aria-label="Dark theme" title="Dark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
    </button>
  </div>
</header>

<div class="toolbar-crumb">
  <span class="tb-title">Projects</span>
  <div class="tb-version" id="app-version" hidden></div>
</div>

<!-- Ships hidden and sits in normal flow as a sibling of everything below it,
     so no innerHTML rebuild on this page can reach it. update-banner.js is the
     only script that touches it; app.ts neither queries nor binds it. -->
<div class="update-banner" id="update-banner" hidden role="status">
  <span id="update-banner-text"></span>
  <button type="button" id="update-banner-view">View release</button>
  <button type="button" id="update-banner-off">Turn off update checks</button>
  <button type="button" id="update-banner-dismiss" aria-label="Dismiss">×</button>
</div>

<section class="home">
  <h2 class="home-heading">Add a project</h2>
  <form class="add-form" id="add-form" hidden>
    <input type="text" id="project-path" autocomplete="off" placeholder="/Users/you/Work/your-project">
    <button type="submit">Add project</button>
  </form>
  <button type="button" id="choose-folder-button" hidden>Choose folder</button>
  <div id="add-error"></div>

  <div id="project-tiles"></div>
</section>

<dialog id="integrations-modal" aria-labelledby="integrations-modal-title">
  <div class="ws-modal-inner">
    <div class="ws-modal-head">
      <h2 id="integrations-modal-title" class="ws-modal-title">Manage integrations</h2>
      <button type="button" id="integrations-modal-close" class="ws-modal-close" aria-label="Close">×</button>
    </div>
    <div class="ws-modal-meta">
      <div class="seg" id="integrations-scope-seg">
        <button type="button" data-scope="global" class="active">Global</button>
        <button type="button" data-scope="project">Project</button>
      </div>
      <select id="integrations-project-select" hidden></select>
    </div>
    <div class="ws-modal-tabs" id="integrations-tabs" role="tablist">
      <button type="button" role="tab" data-tab="cli" aria-selected="true" tabindex="0">Command-line tools</button>
      <button type="button" role="tab" data-tab="gui-app" aria-selected="false" tabindex="-1">Desktop apps</button>
    </div>
    <div class="ws-modal-body">
      <div role="tabpanel" id="integrations-panel-cli"></div>
      <div role="tabpanel" id="integrations-panel-gui-app" hidden></div>
      <div class="integrations-actions">
        <button type="button" id="integrations-rescan">Re-scan</button>
        <button type="button" id="integrations-install-selected">Install selected</button>
      </div>
    </div>
  </div>
</dialog>

<script src="home.js"></script>
</body>
</html>
