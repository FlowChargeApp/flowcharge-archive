<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Praxis Board</title>
<link rel="stylesheet" href="styles.css">
<script src="theme-init.js"></script>
</head>
<body>

<header class="toolbar">
  <img class="tb-wordmark" src="img/flowcharge-wordmark.png" alt="FlowCharge" width="770" height="124">
  <img class="tb-mark" src="img/flowcharge-mark.png" alt="" aria-hidden="true" width="1000" height="1000">
  <div class="seg" id="theme-seg" role="group" aria-label="Theme">
    <button type="button" data-mode="system" aria-label="Match system theme" title="System">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
    </button>
    <button type="button" data-mode="light" aria-label="Light theme" title="Light">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button type="button" data-mode="dark" aria-label="Dark theme" title="Dark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
    </button>
  </div>
</header>

<div class="toolbar-crumb">
  <a class="tb-back" href="/">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    Projects
  </a>
  <span class="tb-crumb-sep" aria-hidden="true">›</span>
  <h1 class="tb-title" id="board-title">Board</h1>
</div>

<div class="toolbar-sub">
  <div class="tb-meta">
    <span class="tb-meta-item">Generated <strong id="gen-date">—</strong></span>
    <span class="tb-meta-item" id="meta-counts"></span>
    <span class="tb-meta-item" id="branch-line" hidden>Branch <strong id="branch-name"></strong></span>
    <span class="tb-meta-item" id="live-status"></span>
  </div>
  <div class="tb-version" id="app-version" hidden></div>
</div>

<!-- Ships hidden and sits in normal flow as a sibling of everything below it,
     so no innerHTML rebuild on this page can reach it. update-banner.js is the
     only script that touches it; app.ts neither queries nor binds it. -->
<div class="update-banner" id="update-banner" hidden role="status">
  <span id="update-banner-text"></span>
  <button type="button" id="update-banner-view">View release</button>
  <button type="button" id="update-banner-off">Turn off update checks</button>
  <button type="button" id="update-banner-dismiss" aria-label="Dismiss">×</button>
</div>

<div class="kpi-strip" id="kpi-strip"></div>

<div class="controls">
  <div class="group">
    <label>Sort</label>
    <div class="seg" id="sort-key-seg">
      <button data-key="id" class="active">Artefact ID</button>
      <button data-key="name">Name</button>
      <button data-key="severity">Severity</button>
      <button data-key="created">Created</button>
      <button data-key="updated">Updated</button>
    </div>
    <div class="seg" id="sort-dir-seg">
      <button data-dir="asc" class="active">Asc</button>
      <button data-dir="desc">Desc</button>
    </div>
  </div>
  <div class="search-wrap">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input type="text" id="search" placeholder="Filter by title, slug, tag, or ID…" autocomplete="off">
  </div>
  <div class="result-count" id="result-count"></div>
  <div class="filter-chips" id="filter-chips" hidden>
    <label>Filter</label>
    <span id="filter-tags"></span>
    <button type="button" id="filter-blocked" class="blocked-toggle">Blocked only</button>
    <button type="button" id="filter-clear" class="filter-clear">Clear</button>
  </div>
</div>

<div class="board" id="board">
  <div class="load-state">
    <h2>Loading this project…</h2>
    <p>Reading the project's <code>flowcharge/</code> folder through the dashboard server. Larger projects take a moment.</p>
  </div>
</div>

<div class="lower" id="lower" hidden>
  <div class="panel">
    <h2>Needs attention <span class="n" id="attn-count"></span></h2>
    <div class="panel-body" id="attn-list"></div>
  </div>
  <div class="panel">
    <h2>Open issues by severity <span class="n" id="sev-total"></span></h2>
    <div class="sev-bar-wrap">
      <div class="sev-bar" id="sev-bar"></div>
      <div class="sev-legend" id="sev-legend"></div>
    </div>
  </div>
</div>

<!-- Card detail modal. No `open` attribute — app.ts calls showModal(). All content
     lives in .ws-modal-inner because #ws-modal carries no padding: backdrop
     dismissal tests `e.target === dialog`, and padding on the dialog would make a
     click on that padding close it too. -->
<dialog id="ws-modal" aria-labelledby="ws-modal-title">
  <div class="ws-modal-inner">
    <div class="ws-modal-head">
      <div class="ws-modal-headings">
        <div class="ws-modal-id-row">
          <span id="ws-modal-sev-dot" class="dot-sm" hidden aria-hidden="true"></span>
          <span id="ws-modal-id" class="ws-modal-id"></span>
        </div>
        <h2 id="ws-modal-title" class="ws-modal-title"></h2>
        <span id="ws-modal-status" class="ws-modal-status"></span>
      </div>
      <button type="button" id="ws-modal-close" class="ws-modal-close" aria-label="Close">×</button>
    </div>

    <div class="ws-modal-meta" id="ws-modal-meta">
      <div id="ws-modal-blocked" class="ws-modal-blocked" hidden>
        <span class="blocked-pill">Blocked</span>
        <span id="ws-modal-blocked-reason"></span>
      </div>
      <p id="ws-modal-description" class="ws-modal-description is-clamped" hidden></p>
      <button type="button" id="ws-modal-description-more"
              class="ws-modal-description-more" hidden>Show more</button>
      <div class="card-tags" id="ws-modal-tags" hidden></div>
      <div class="ws-modal-dates" id="ws-modal-dates"></div>
    </div>

    <div class="ws-modal-tabs" id="ws-modal-tabs" role="tablist">
      <button type="button" role="tab" id="ws-tab-plan" data-tab="plan" aria-controls="ws-panel-plan" aria-selected="false" tabindex="-1">Plan</button>
      <button type="button" role="tab" id="ws-tab-issues" data-tab="issues" aria-controls="ws-panel-issues" aria-selected="true" tabindex="0">Issues</button>
      <button type="button" role="tab" id="ws-tab-tasks" data-tab="tasks" aria-controls="ws-panel-tasks" aria-selected="false" tabindex="-1">Tasks</button>
    </div>

    <div class="ws-modal-body">
      <div role="tabpanel" id="ws-panel-plan" aria-labelledby="ws-tab-plan" hidden></div>
      <div role="tabpanel" id="ws-panel-issues" aria-labelledby="ws-tab-issues"></div>
      <div role="tabpanel" id="ws-panel-tasks" aria-labelledby="ws-tab-tasks" hidden></div>
    </div>
  </div>
</dialog>

<script src="app.js"></script>
</body>
</html>
